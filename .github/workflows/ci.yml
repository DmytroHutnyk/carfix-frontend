name: CI
on:
  pull_request:
  push:
    branches: [dev]

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        env:
          NEXT_PUBLIC_API_BASE: /api
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ci-dummy-key
        run: npm run build